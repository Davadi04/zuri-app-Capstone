name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend - lint and test
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test

      - name: SonarQube Cloud scan and quality gate
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: backend
          args: -Dsonar.qualitygate.wait=true

  backend-image:
    name: Backend - build, scan, push
    needs: backend-quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image (not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          push: false
          tags: scan-me-backend:${{ github.sha }}

      - name: Trivy scan (fails on CRITICAL or HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan-me-backend:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Set lowercase image owner
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/zuri-backend:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_OWNER }}/zuri-backend:latest

  backend-deploy:
    name: Backend - deploy to Kubernetes
    needs: backend-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_DEPLOY_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_DEPLOY_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      - name: Find EC2 instance ID
        id: instance
        run: |
          IID=$(aws ec2 describe-instances --region eu-west-2 \
            --filters "Name=tag:Name,Values=zuri-dev-node" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          echo "id=$IID" >> "$GITHUB_OUTPUT"

      - name: Roll out new backend image via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.instance.outputs.id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["sudo k3s kubectl -n zuri-market set image deployment/backend backend=ghcr.io/davadi04/zuri-backend:${{ github.sha }}","sudo k3s kubectl -n zuri-market rollout status deployment/backend --timeout=120s"]' \
            --query "Command.CommandId" --output text)
          sleep 5
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ steps.instance.outputs.id }}" \
            --query "StandardOutputContent" --output text

  frontend-quality:
    name: Frontend - lint and build
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test --if-present
      - run: npm run build

      - name: SonarQube Cloud scan and quality gate
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_FRONTEND }}
        with:
          projectBaseDir: frontend
          args: -Dsonar.qualitygate.wait=true

  frontend-image:
    name: Frontend - build, scan, push
    needs: frontend-quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image (not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          build-args: |
            VITE_API_URL=
          load: true
          push: false
          tags: scan-me-frontend:${{ github.sha }}

      - name: Trivy scan (fails on CRITICAL or HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan-me-frontend:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Set lowercase image owner
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: frontend
          build-args: |
            VITE_API_URL=
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/zuri-frontend:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_OWNER }}/zuri-frontend:latest

  frontend-deploy:
    name: Frontend - deploy to Kubernetes
    needs: frontend-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_DEPLOY_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_DEPLOY_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      - name: Find EC2 instance ID
        id: instance
        run: |
          IID=$(aws ec2 describe-instances --region eu-west-2 \
            --filters "Name=tag:Name,Values=zuri-dev-node" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          echo "id=$IID" >> "$GITHUB_OUTPUT"

      - name: Roll out new frontend image via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.instance.outputs.id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["sudo k3s kubectl -n zuri-market set image deployment/frontend frontend=ghcr.io/davadi04/zuri-frontend:${{ github.sha }}","sudo k3s kubectl -n zuri-market rollout status deployment/frontend --timeout=120s"]' \
            --query "Command.CommandId" --output text)
          sleep 5
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ steps.instance.outputs.id }}" \
            --query "StandardOutputContent" --output text

  terraform-validate:
    name: Terraform - fmt, validate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: terraform/environments/dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.0"
      - run: terraform fmt -check -recursive ../..
      - run: terraform init -backend=false
      - run: terraform validate

  terraform-apply:
    name: Terraform - apply infrastructure
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: terraform/environments/dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.0"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_TF_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_TF_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2
      - run: terraform init
      - run: terraform apply -var-file=dev.tfvars -auto-approve